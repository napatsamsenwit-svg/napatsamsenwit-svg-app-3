name: job-watch
on:
  push:
    paths: [".job-watch/acadex-feed.json", ".job-watch/acadex-status.json"]
  schedule:
    - cron: "*/5 * * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      daily:
        description: "ส่งสรุปรายวัน + เตือนวันสำคัญ"
        type: boolean
        default: false
      test:
        description: "ส่งข้อความทดสอบเข้า LINE"
        type: boolean
        default: false
      digest:
        description: "ส่งสรุปงานน่าสนใจเข้า LINE"
        type: boolean
        default: false
      mac_at:
        description: "เวลา (วินาที) ที่ Mac ส่งสัญญาณ ใช้เช็กว่า Mac ยังทำงาน"
        type: string
        default: ""
permissions:
  contents: write
  actions: read
concurrency: job-watch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ตรวจงาน (วนทุก 2 นาทีเมื่อเริ่มจากตัวตั้งเวลา)
        run: bash scripts/loop.sh
        env:
          GH_TOKEN: ${{ github.token }}
          LOOP: ${{ github.event.schedule == '*/5 * * * *' && '1' || '' }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_TEST: ${{ inputs.test && '1' || '' }}
          LINE_DIGEST: ${{ inputs.digest && '1' || '' }}
          GH_EVENT: ${{ github.event_name }}
          MAC_AT: ${{ inputs.mac_at }}
          LINE_DAILY: ${{ (inputs.daily || github.event.schedule == '0 1 * * *') && '1' || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
