name: hello-once
on: workflow_dispatch
permissions:
  contents: read
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - run: |
          node --input-type=module -e '
          const r = await fetch("https://api.line.me/v2/bot/message/broadcast", { method: "POST",
            headers: { authorization: `Bearer ${process.env.T}`, "content-type": "application/json" },
            body: JSON.stringify({ messages: [{ type: "text", text: "สวัสดีปาล์ม 👋 ผู้ช่วยของมาร์คเองนะ หวังว่าคุณจะสามารถหางานที่ดีที่สุดช่วยเขาได้ 🙏" }] }) });
          console.log("broadcast status", r.status, r.ok ? "" : await r.text());
          '
        env:
          T: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
